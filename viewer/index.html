<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>everyblock | check any block before you buy or sell</title>
  <meta name="description" content="What is any HDB block really worth? Every registered resale since 1990, at block and floor level, on a 3D map of Singapore. No listings, no ads." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0d0d0d" />
  <meta property="og:title" content="everyblock | check any block before you buy or sell" />
  <meta property="og:description" content="What is any HDB block really worth? Every registered resale since 1990, block by block, floor by floor, on a 3D map of Singapore." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://everyblock.sg/" />
  <meta property="og:image" content="https://everyblock.sg/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://everyblock.sg/og.png" />
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/src/base.css" />
  <link rel="stylesheet" href="/src/atlas.css" />
</head>
<body>
  <div id="map"></div>
  <header id="title" class="app-ui">
    <strong>everyblock</strong>
  </header>
  <div id="search" class="chip app-ui">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16l4 4"/></svg>
    <input id="search-input" aria-label="Search, or ask about prices" type="text" placeholder="Find a block, a place, a story…" autocomplete="off" spellcheck="false" />
    <kbd aria-hidden="true">↵</kbd>
    <div id="search-results"></div>
  </div>
  <aside id="panel" class="hidden app-ui" aria-label="Block details"></aside>
  <div id="legend" class="chip app-ui">
    <div class="caption-row"><span class="caption" id="legend-caption">S$ / m² · trailing 12 mo</span></div>
    <div class="bar" id="legend-bar"></div>
    <div class="ends"><span id="legend-min"></span><span id="legend-max"></span></div>
    <div class="caption-row setting-row"><span class="caption">Colour scale</span><div class="seg"><button id="seg-now" class="on">Relative</button><button id="seg-all">Historical</button></div></div>
    <div class="caption-row setting-row"><span class="caption">Base map</span><div class="seg"><button id="base-dark" class="on">Atlas</button><button id="base-sat">Satellite</button></div></div>
    <div class="caption-row setting-row"><span class="caption">MRT stations</span><div class="seg"><button id="st-on" class="on">On</button><button id="st-off">Off</button></div></div>
    <div class="caption-row setting-row"><span class="caption">Building height</span><div class="seg"><button id="height-true" aria-pressed="false">True</button><button id="height-enhanced" aria-pressed="true" class="on">Enhanced</button></div></div>
    <button id="intro-replay">Revisit the introduction <span aria-hidden="true">↗</span></button>
  </div>
  <div id="map-tools" class="app-ui">
    <button id="view-island" title="Show all Singapore" aria-label="Show all Singapore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M8 12h8M12 8v8"/></svg></button>
    <button id="map-settings" aria-expanded="false" aria-controls="legend" title="Map settings" aria-label="Map settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7h18M3 17h18"/><circle cx="9" cy="7" r="3" fill="#202422"/><circle cx="16" cy="17" r="3" fill="#202422"/></svg></button>
    <button id="compass" aria-label="Reset north" title="Rotate: right-drag or Ctrl+drag. Click to face north."><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3 L15.4 13 H8.6 Z" fill="#c4a782"/><path d="M8.6 13 H15.4 L12 21 Z" fill="#a5aca7"/></svg></button>
  </div>
  <section id="time-dock" class="app-ui" aria-label="Housing timeline">
    <div class="timeline-heading"><span id="data-through"></span></div>
    <div id="ticker"><div id="event"><strong id="event-title"></strong><span id="event-sub"></span></div><div id="stats"><span id="stat-median"></span><span class="sep">·</span><span id="stat-sales"></span><span class="sep">·</span><span id="stat-blocks"></span></div></div>
    <div id="scrubber"><button id="play" aria-label="Play timeline">&#9654;</button><div class="slider-wrap"><input id="month" aria-label="Month in the housing timeline" type="range" min="0" max="438" value="438" step="1" /><div id="era-dots"></div></div><div id="date"></div></div>
    <div class="timeline-years" aria-hidden="true"><span>1990</span><span>2000</span><span>2010</span><span>2020</span><span id="last-year">2026</span></div>
  </section>
  <div id="filter-chip" class="chip hidden app-ui"><span id="filter-label"></span><button id="filter-clear" aria-label="Clear filter">×</button></div>
  <div id="toast" role="status"></div>
  <section id="loading" aria-label="Welcome to Everyblock">
    <div class="intro-brand"><strong>everyblock</strong></div>
    <div class="intro-copy"><h1>Singapore,<br /><em>block by block.</em></h1><button id="intro-enter" disabled>Preparing the atlas <span aria-hidden="true">↗</span></button><button id="load-retry" hidden>Try again ↗</button></div>
    <div class="intro-location"><span class="location-dot"></span><div>ANG MO KIO<span>1.3697° N &nbsp; 103.8435° E</span></div></div>
    <div class="intro-progress"><div><span id="load-status" role="status">Bringing the neighbourhood into view</span><span id="load-percent">0%</span></div><div class="load-bar"><i id="load-fill"></i></div></div>
  </section>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
